<script>
'use strict';

let apps;try{apps=JSON.parse(localStorage.getItem('multi-app-prototype-v02')||'null');if(!Array.isArray(apps)||!apps.every(a=>typeof a.app_id==='string'&&typeof a.name==='string'))apps=structuredClone(seeds)}catch{apps=structuredClone(seeds)}
const sourceAppSnapshot=a=>({name:a.name,package_name:a.package_name,app_id:a.app_id});
const users=Array.from({length:18},(_,i)=>{const a=seeds[i%8],type=i===2?'游客':'正式账户';return {Id:'DEMO-RECORD-'+String(i+1).padStart(4,'0'),package_name:a.package_name,app_id:a.app_id,user_id:'DEMO-USER-'+String(i===1?1:i+1).padStart(4,'0'),unionId:i!==2&&(i%3===0||i%3===2)?'DEMO-UNION-00000000-EXAMPLE-ONLY-'+String(i+1).padStart(4,'0'):null,phone:i!==2&&(i%3===0||i%3===1)?'DEMO-PHONE-'+String(i===1?1:i+1).padStart(4,'0'):null,type,first_registration_app:type==='游客'?null:sourceAppSnapshot(seeds[i===1?0:i%8]),last_login_app:i===2?null:sourceAppSnapshot(seeds[i<2?1:i%8]),registration_date:'2026-10-'+String(8-Math.floor(i/3)).padStart(2,'0')+' 09:'+String(50-i).padStart(2,'0')+':00',last_login_date:i===2?null:'2026-10-08 10:'+String(50-i).padStart(2,'0')+':00',status:i===3?'已注销':i===4||i===5?'已合并':'正常',cancellation_date:i===3?'2026-10-08 11:00:00':null,merged_to_user_id:i===4?'DEMO-USER-0001':i===5?'DEMO-USER-9999':null,merge_date:i===4||i===5?'2026-10-08 11:20:00':null}});
// The same main account retains consistent bound identity across its two application records.
Object.assign(users[1],{type:users[0].type,unionId:users[0].unionId});
let page='apps',appQuery='',userFilters={},pageNum=1,pageSize=6,advanced=false,returnFocus=null,saving=false,toastTimer;
let globalAppScope='';try{globalAppScope=sessionStorage.getItem('admin-global-app-scope')||''}catch{}
const icon=name=>`<img class="icon" src="assets/icons/${name}_line.svg" alt="">`;
const appName=r=>apps.find(a=>a.package_name===r.package_name&&a.app_id===r.app_id)?.name||seeds.find(a=>a.package_name===r.package_name)?.name||'未登记应用';
const tag=s=>`<span class="tag ${s==='正常'?'normal':s==='已合并'?'merged':''}">${esc(s)}</span>`;
const date=s=>s?`<span class="date">${s.slice(0,10)}<br><span class="small">${s.slice(11)}</span></span>`:'—';
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function switchPage(p){page=p;pageNum=1;pageSize=6;render()}
function field(label,html){return `<div class="field">${label}${html}</div>`}
function userMatch(r,f){return inAppScope(r)&&(!f.q||r[f.by||'user_id']===f.q)&&(!f.type||r.type===f.type)&&(!f.status||r.status===f.status)&&['Id','unionId'].every(k=>!f[k]||r[k]===f[k])&&[['reg','registration_date'],['login','last_login_date']].every(([p,k])=>(!f[p+'Start']||(r[k]&&r[k].slice(0,10)>=f[p+'Start']))&&(!f[p+'End']||(r[k]&&r[k].slice(0,10)<=f[p+'End'])))}
function filtered(){return page==='apps'?apps.filter(a=>[a.name,a.package_name,a.app_id].some(v=>v.toLowerCase().includes(appQuery.toLowerCase()))):users.filter(r=>userMatch(r,userFilters))}
function render(){dqUnmount();$('#main').classList.remove('data-content');if(!ensureSession())return;renderIdentity();renderGlobalAppScope();$('.global-app-filter').hidden=page==='admin_users'||page==='data_query';if(page==='data_query'){renderData();return}if(page==='admin_users'){renderAdminUsers();return}if(isMoneyPage()){renderMoney();return}document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('selected',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});$('#crumb').innerHTML=`<span>${page==='apps'?'资产管理':'用户管理'}</span><span aria-hidden="true">/</span><strong>${page==='apps'?'应用管理':'用户列表'}</strong>`;
 $('#main').innerHTML=page==='apps'?appsPage():usersPage();bindFilters();renderRows();}
function appsPage(){return `<div class="page-head" data-od-id="apps-heading"><div><h1>应用管理</h1><p>维护应用基础档案，统一管理应用标识。</p></div><button class="primary with-icon" id="create-app" data-od-id="create-app">${icon('add')}新增应用</button></div><section class="panel" data-od-id="apps-panel"><form class="filters app-filters" id="app-filter"><div class="field"><label for="app-search">应用查询</label><div class="search-box">${icon('search')}<input id="app-search" value="${esc(appQuery)}" placeholder="搜索应用名称、包名或华为 App ID" data-od-id="app-search"></div></div><button type="submit">查询</button><button type="button" id="reset">重置</button></form><div class="table-head"><h2>应用列表<span class="count" id="result-count"></span></h2><span class="small">按创建时间倒序</span></div><div id="results"></div></section><p class="footnote">应用档案仅用于维护基础信息。</p>`}
function select(id,options,value){return `<select id="${id}" name="${id}">${options.map(([v,n])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
function input(id,value,placeholder='精确匹配'){return `<input id="${id}" name="${id}" value="${esc(value||'')}" placeholder="${placeholder}">`}
function usersPage(){const f=userFilters;return `<div class="page-head" data-od-id="users-heading"><div><h1>用户列表</h1><p>按顶部应用范围查询用户身份、账号状态与关联记录。</p></div><span class="readonly-label">仅查询</span></div><section class="panel" data-od-id="users-panel"><form class="filters" id="user-filter"><div class="filter-grid scope-filter-grid">${field('<label for="q">快速查询</label>',`<div class="quick">${select('by',[['user_id','用户 ID'],['phone','手机号']],f.by||'user_id')}${input('q',f.q,'输入完整查询值')}</div>`)}${field('<label for="type">账号类型</label>',select('type',[['','全部类型'],...['游客','正式账户'].map(x=>[x,x])],f.type||''))}${field('<label for="status">账号状态</label>',select('status',[['','全部状态'],...['正常','已注销','已合并'].map(x=>[x,x])],f.status||''))}</div><div class="filter-second">${dateRange('reg','注册日期',f)}${dateRange('login','最近登录日期',f)}</div><div class="advanced" id="advanced" ${advanced?'':'hidden'}>${['Id','unionId'].map((k,i)=>field(`<label for="${k}">${['记录 ID','华为 UnionID'][i]}</label>`,input(k,f[k]))).join('')}</div><div class="filter-error" id="filter-error" role="alert" hidden></div><div class="filter-actions"><button class="primary with-icon" type="submit" data-od-id="query-users">${icon('search')}查询</button><button type="button" id="reset">重置</button><button type="button" class="text-btn advanced-toggle" id="advanced-toggle" aria-expanded="${advanced}">${advanced?'收起':'展开'}高级查询</button></div></form><div class="table-head"><h2>用户关联记录<span class="count" id="result-count"></span></h2><div class="table-tools"><span class="small">按注册时间倒序</span>${exportControl()}</div></div><div id="results"></div></section><p class="footnote">同一用户可关联多个应用；账号类型分为游客和正式账户。手机号与标识均为虚构示例。</p>`}
function dateRange(prefix,label,f){return `<div class="field"><span class="field-title">${label}</span><div class="range"><input type="date" name="${prefix}Start" aria-label="${label}开始" value="${esc(f[prefix+'Start']||'')}"><span class="small">至</span><input type="date" name="${prefix}End" aria-label="${label}结束" value="${esc(f[prefix+'End']||'')}"></div></div>`}
function bindFilters(){if(page==='apps'){$('#create-app').onclick=()=>openAppForm();$('#app-filter').onsubmit=e=>{e.preventDefault();appQuery=$('#app-search').value.trim();pageNum=1;renderRows()}}else{$('#by').setAttribute('aria-label','快速查询字段');$('#user-filter').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));Object.keys(f).forEach(k=>f[k]=f[k].trim());const invalid=['reg','login'].some(k=>f[k+'Start']&&f[k+'End']&&f[k+'Start']>f[k+'End']);$('#filter-error').hidden=!invalid;if(invalid){$('#filter-error').textContent='开始日期不能晚于结束日期，请调整后查询。';return}userFilters=f;pageNum=1;renderRows()};$('#advanced-toggle').onclick=()=>{advanced=!advanced;$('#advanced').hidden=!advanced;$('#advanced-toggle').textContent=(advanced?'收起':'展开')+'高级查询';$('#advanced-toggle').setAttribute('aria-expanded',advanced)}}$('#reset').onclick=()=>{if(page==='apps')appQuery='';else{userFilters={};advanced=false}pageNum=1;render()}}
function markControls(root,prefix){root.querySelectorAll('h1,h2,h3,button,input,select,textarea,section,form').forEach((el,i)=>{if(!el.dataset.odId)el.dataset.odId=prefix+'-'+(el.id||el.name||el.tagName.toLowerCase()+'-'+i).replace(/[^a-z0-9-]/gi,'-').toLowerCase()})}
function renderRows(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));pageNum=Math.min(pageNum,pages);const items=rows.slice((pageNum-1)*pageSize,pageNum*pageSize);$('#result-count').textContent=`共 ${rows.length} ${page==='apps'?'个应用':'条关联记录'}`;
if(page==='users')bindExport(rows);
if(page==='apps'&&!apps.length){$('#results').innerHTML='<div class="empty" data-od-id="apps-empty"><h2>暂无应用</h2><p>点击页面右上方“新增应用”登记应用档案。</p></div>';markControls($('#main'),page);return}
if(!rows.length){$('#results').innerHTML=`<div class="empty" data-od-id="empty-results">${icon('search')}<h2>没有找到匹配${page==='apps'?'应用':'的关联记录'}</h2><p>请检查查询值，或重置筛选条件后再试。</p><button id="empty-reset">重置筛选</button></div>`;$('#empty-reset').onclick=()=>$('#reset').click();markControls($('#main'),page);return}
$('#results').innerHTML=`<div class="table-wrap" tabindex="0" role="region" aria-label="${page==='apps'?'应用':'用户关联记录'}表格，可横向滚动"><table class="${page}-table">${page==='apps'?appTable(items):userTable(items)}</table></div><div class="pagination"><span class="small">显示第 ${(pageNum-1)*pageSize+1}–${Math.min(pageNum*pageSize,rows.length)} ${page==='apps'?'个应用':'条关联记录'}</span><div class="pages"><select class="page-size" id="page-size" aria-label="每页条数">${[6,10,20].map(n=>`<option ${n===pageSize?'selected':''} value="${n}">${n} 条 / 页</option>`).join('')}</select><button id="prev-page" ${pageNum===1?'disabled':''}>上一页</button>${Array.from({length:pages},(_,i)=>`<button data-number="${i+1}" class="${i+1===pageNum?'current':''}" ${i+1===pageNum?'aria-current="page"':''}>${i+1}</button>`).join('')}<button id="next-page" ${pageNum===pages?'disabled':''}>下一页</button></div></div>`;
markControls($('#main'),page);$('#prev-page').onclick=()=>{pageNum--;renderRows()};$('#next-page').onclick=()=>{pageNum++;renderRows()};$('#page-size').onchange=e=>{pageSize=Number(e.target.value);pageNum=1;renderRows()};document.querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>{pageNum=Number(b.dataset.number);renderRows()});document.querySelectorAll('[data-app-detail]').forEach(b=>b.onclick=()=>openAppDetail(b.dataset.appDetail));document.querySelectorAll('[data-app-edit]').forEach(b=>b.onclick=()=>openAppForm(b.dataset.appEdit));document.querySelectorAll('[data-app-delete]').forEach(b=>b.onclick=()=>openAppDelete(b.dataset.appDelete));document.querySelectorAll('[data-user-detail]').forEach(b=>b.onclick=()=>openUser(b.dataset.userDetail));}
function appTable(items){return `<colgroup><col style="width:21%"><col style="width:23%"><col style="width:22%"><col style="width:16%"><col style="width:18%"></colgroup><thead><tr>${['应用名称','应用包名','华为 App ID','创建时间','操作'].map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${items.map(a=>`<tr data-od-id="app-row-${esc(a.id.toLowerCase())}"><td><div class="app-name"><span class="app-tile">${esc(a.name.slice(0,1))}</span><span class="cell-title">${esc(a.name)}</span></div></td><td class="mono">${esc(a.package_name)}</td><td class="mono">${esc(a.app_id)}</td><td>${date(a.created)}</td><td><div class="row-actions"><button class="text-btn" data-app-detail="${esc(a.id)}">详情</button><button class="text-btn" data-app-edit="${esc(a.id)}">编辑</button><button class="text-btn danger-link" data-app-delete="${esc(a.id)}">删除</button></div></td></tr>`).join('')}</tbody>`}
function sourceAppDetail(label,source){return `<div class="detail-row source-app-row"><dt>${label}</dt><dd>${source?`<div class="cell-title">${esc(source.name)}</div><div class="copy-value"><span class="mono">${esc(source.package_name)}</span><button class="text-btn" data-copy="${esc(source.package_name)}" aria-label="复制${label}包名">复制</button></div>`:'—'}</dd></div>`}
function userTable(items){return `<colgroup><col style="width:196px"><col style="width:164px"><col style="width:120px"><col style="width:160px"><col style="width:120px"><col style="width:128px"><col style="width:80px"></colgroup><thead><tr>${['所属应用','用户 ID','账号类型','账号状态','注册时间','最近登录时间','操作'].map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${items.map(r=>`<tr data-od-id="user-row-${r.Id.toLowerCase()}"><td><div class="cell-title">${esc(appName(r))}</div><div class="small mono">${esc(r.package_name)}</div></td><td class="mono">${esc(r.user_id)}</td><td><div class="identity"><span class="tag">${esc(r.type)}</span></div></td><td>${tag(r.status)}${r.status==='已合并'?'<div class="small">详情查看合并去向</div>':''}</td><td>${date(r.registration_date)}</td><td>${date(r.last_login_date)}</td><td><button class="text-btn" data-user-detail="${r.Id}">详情</button></td></tr>`).join('')}</tbody>`}
function showDrawer(title,subtitle,body,foot){if($('#overlay').hidden)returnFocus=document.activeElement;$('#drawer-title').textContent=title;$('#drawer-subtitle').textContent=subtitle;$('#drawer-body').innerHTML=body;$('#drawer-foot').innerHTML=foot;$('#overlay').hidden=false;$('#shell').inert=true;document.body.style.overflow='hidden';$('#drawer-body').scrollTop=0;$('#drawer-close').focus();markControls($('#overlay'),'drawer');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));}
function closeDrawer(){if(saving)return;$('#overlay').hidden=true;$('#shell').inert=false;document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus();else $('.nav-btn.selected').focus()}
$('#drawer-close').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeDrawer()}if(e.key==='Tab'){const els=[...$('#overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(x=>!x.closest('[hidden]'));if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
async function copy(value){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const t=document.createElement('textarea');t.value=value;$('#drawer-body').append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy')}toast('已复制到剪贴板')}catch{toast('复制未完成，请选中完整标识手动复制')}}
function detail(label,value,canCopy=false){return `<div class="detail-row"><dt>${label}</dt><dd>${canCopy&&value?`<div class="copy-value"><span class="mono">${esc(value)}</span><button class="text-btn" data-copy="${esc(value)}" aria-label="复制${label}">复制</button></div>`:esc(value||'—')}</dd></div>`}
function openAppDetail(id){const a=apps.find(x=>x.id===id);showDrawer('应用详情','应用基础档案',`<div class="detail-intro"><span class="app-tile">${esc(a.name.slice(0,1))}</span><div><h3>${esc(a.name)}</h3><span class="small">应用档案</span></div></div><dl class="details">${detail('应用名称',a.name)}${detail('应用包名',a.package_name,true)}${detail('华为 App ID',a.app_id,true)}${detail('创建时间',a.created)}${detail('备注',a.note)}</dl>`,`<button data-close>关闭</button><button class="primary" id="detail-edit">编辑应用</button>`);$('#detail-edit').onclick=()=>openAppForm(id)}

function validateApp(v,id){const errors={};if(!v.name)errors.name='请输入应用名称';if(!v.package_name)errors.package_name='请输入应用包名';else if(!/^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/.test(v.package_name))errors.package_name='请输入以点分隔的应用包名，例如 com.example.demo';if(!v.app_id)errors.app_id='请输入华为 App ID';for(const key of ['package_name','app_id'])if(v[key]&&apps.some(a=>a.id!==id&&a[key]===v[key]))errors[key]=(key==='app_id'?'华为 App ID':'应用包名')+'已被其他应用使用';return errors}

function isMoneyPage(){return Object.hasOwn(moneyConfig,page)}

function moneyMatch(r,f,c){
 if(!inAppScope(r))return false;
 if(f.q&&String(r[f.by||c.search[0][0]]??'')!==f.q)return false;
 for(const k of ['product_type',c.filter,'auto_renew','duration','notification_subtype'])if(f[k]!==undefined&&f[k]!==''&&String(r[k]??'')!==f[k])return false;
 if(f.user_binding==='pending'&&r.user_id!=null)return false;
 if(f.user_binding==='linked'&&r.user_id==null)return false;
 const d=(r[c.time]||'').slice(0,10);
 return (!f.timeStart||(d&&d>=f.timeStart))&&(!f.timeEnd||(d&&d<=f.timeEnd));
}

const dqChartTypes={table:'表格',line:'折线图',bar:'柱状图',pie:'饼图',funnel:'漏斗图'};
function dqNumeric(v){if(v===null||v===''||typeof v==='boolean'||!['string','number'].includes(typeof v))return null;if(typeof v==='string'&&!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(v.trim()))return null;const n=Number(v);return Number.isFinite(n)&&Math.abs(n)<=Number.MAX_SAFE_INTEGER?n:null}

function dqChartPoints(r,c){if(c.metric<0||c.dimension<0||c.metric===c.dimension)return {error:'请选择不同的维度列与数值指标列。至少需要两列查询结果。'};const points=r.rows.map((row,i)=>({label:row[c.dimension]===null?'空值':String(row[c.dimension]),value:dqNumeric(row[c.metric]),index:i}));if(points.some(p=>p.value===null))return {error:'指标列包含空值、非数字或超出安全精度的数值。请更换指标，或在 SQL 中处理后重新查询。'};if(new Set(points.map(p=>p.label)).size!==points.length)return {error:'维度存在重复值。请在查询中分组汇总，或选择可唯一标识每行的维度。图表不会自动合并记录。'};if(['pie','funnel'].includes(c.type)&&points.some(p=>p.value<0))return {error:'饼图和漏斗图不支持负数，请选择非负指标或切换折线图、柱状图。'};const total=points.reduce((sum,p)=>sum+p.value,0);if(c.type==='pie'&&points.length>6)return {error:'饼图最多展示 6 个分类。请在查询中减少分类，或使用柱状图查看全部数据。'};if(c.type==='pie'&&total<=0)return {error:'饼图需要大于零的合计值，请更换指标。'};if(c.type==='funnel'&&(points[0].value<=0||points.some((p,i)=>i>0&&p.value>points[i-1].value)))return {error:'漏斗图需要按业务阶段排列且逐步不增的数值，首阶段须大于零。请在查询中设置阶段顺序，或使用柱状图。'};return {points,total}}
function dqResultTable(r){return `<div class="dq-result-table" tabindex="0" role="region" aria-label="查询结果表格，可横向滚动"><table><thead><tr>${r.columns.map(c=>`<th scope="col" title="${esc(c)}">${esc(r.columnLabels?.[c]||c)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row=>`<tr>${row.map(v=>`<td>${v==null?'<span class="small">NULL</span>':esc(typeof v==='object'?JSON.stringify(v):v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dqChartTools(t,r){const c=dqChartConfig(t,r),label=i=>r.columnLabels?.[r.columns[i]]||r.columns[i];return `<div class="dq-chart-toolbar" data-od-id="result-chart-controls"><div class="dq-chart-switch" role="group" aria-label="结果展示方式">${Object.entries(dqChartTypes).map(([k,v])=>`<button data-chart-type="${k}" data-od-id="result-view-${k}" aria-pressed="${c.type===k}" aria-label="${v}" title="${v}">${icon(({table:'table',line:'chart_line',bar:'chart_bar',pie:'chart_pie',funnel:'filter'})[k])}</button>`).join('')}</div>${c.type==='table'?'':`<div class="dq-chart-fields"><label for="dq-chart-dimension">维度<select id="dq-chart-dimension" data-od-id="chart-dimension"><option value="-1">选择维度列</option>${r.columns.map((col,i)=>`<option value="${i}" ${i===c.dimension?'selected':''}>${esc(label(i))}</option>`).join('')}</select></label><label for="dq-chart-metric">指标<select id="dq-chart-metric" data-od-id="chart-metric"><option value="-1">选择数值列</option>${r.columns.map((col,i)=>`<option value="${i}" ${i===c.metric?'selected':''}>${esc(label(i))}</option>`).join('')}</select></label></div>`}</div>`}
const dqChartNum=n=>Math.abs(n)>0&&Math.abs(n)<.01?n.toExponential(2):new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2,notation:Math.abs(n)>=10000?'compact':'standard'}).format(n);
function dqChartSVG(points,type){const width=Math.max(640,points.length*88+112),height=364,left=80,right=width-24,top=36,bottom=260;let lo=Math.min(0,...points.map(p=>p.value)),hi=Math.max(0,...points.map(p=>p.value));if(lo===hi)hi=1;const rough=(hi-lo)/4,magnitude=Math.pow(10,Math.floor(Math.log10(rough)))||Number.MIN_VALUE,tick=([1,2,2.5,5,10].find(v=>v*magnitude>=rough)||10)*magnitude;lo=Math.floor(lo/tick)*tick;hi=Math.ceil(hi/tick)*tick;if(hi===lo)hi=lo+tick;const y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top),step=(right-left)/points.length,x=i=>left+step*(i+.5),zero=y(0);let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="group" aria-label="${dqChartTypes[type]}，横轴按查询返回顺序排列">`;
 for(let i=0;i<=Math.round((hi-lo)/tick);i++){const v=lo+tick*i,pos=y(v);svg+=`<line x1="${left}" x2="${right}" y1="${pos}" y2="${pos}" class="dq-chart-grid"/><text x="${left-12}" y="${pos+4}" text-anchor="end" class="dq-chart-tick">${esc(dqChartNum(v))}</text>`}

function dqPieSVG(points,total){let angle=-Math.PI/2;const cx=160,cy=160,radius=128;let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="group" aria-label="饼图占比，分类与数值见旁侧图例">';points.forEach((p,i)=>{const delta=p.value/total*Math.PI*2,end=angle+delta;const color=`oklch(${42+i*7}% ${.16-i*.017} 255)`;if(p.value>0){const mark=delta>=Math.PI*2-1e-8?`<circle cx="${cx}" cy="${cy}" r="${radius}"/>`:`<path d="M ${cx} ${cy} L ${cx+radius*Math.cos(angle)} ${cy+radius*Math.sin(angle)} A ${radius} ${radius} 0 ${delta>Math.PI?1:0} 1 ${cx+radius*Math.cos(end)} ${cy+radius*Math.sin(end)} Z"/>`;const mid=angle+delta/2;svg+=`<g fill="${color}" stroke="var(--surface)" stroke-width="2" tabindex="0" role="img" aria-label="${esc(p.label+'：'+p.value+'，'+(p.value/total*100).toFixed(1)+'%')}" data-chart-point="${i}" data-od-id="chart-point-${i}"><title>${esc(p.label)}：${p.value}</title>${mark}</g>`;if(delta>.27)svg+=`<text x="${cx+radius*.7*Math.cos(mid)}" y="${cy+radius*.7*Math.sin(mid)+4}" text-anchor="middle" class="dq-pie-index" fill="${i<3?'var(--surface)':'var(--fg)'}">${i+1}</text>`}angle=end});return svg+'</svg>'}
function dqChartView(t,r){const c=dqChartConfig(t,r);if(c.type==='table')return dqResultTable(r);const data=dqChartPoints(r,c);if(data.error)return `<div class="dq-chart-notice" role="status"><strong>当前数据暂不适合此图表</strong><p>${esc(data.error)}</p></div>`;const {points,total}=data,label=i=>r.columnLabels?.[r.columns[i]]||r.columns[i];let chart='';
 if(c.type==='line'||c.type==='bar')chart=`<div class="dq-chart-scroll" tabindex="0" role="region" aria-label="图表绘图区，可横向滚动">${dqChartSVG(points,c.type)}</div>`;
 if(c.type==='pie')chart=`<div class="dq-pie-layout">${dqPieSVG(points,total)}<ol class="dq-pie-legend">${points.map((p,i)=>`<li data-od-id="pie-legend-${i}"><span class="dq-pie-key" style="background:oklch(${42+i*7}% ${.16-i*.017} 255);color:${i<3?'var(--surface)':'var(--fg)'}">${i+1}</span><span>${esc(p.label)}</span><strong>${esc(dqChartNum(p.value))}</strong><span>${(p.value/total*100).toFixed(1)}%</span></li>`).join('')}</ol></div>`;
 if(c.type==='funnel')chart=`<div class="dq-funnel">${points.map((p,i)=>`<div class="dq-funnel-stage" data-od-id="funnel-stage-${i}"><div class="dq-funnel-label"><span>${i+1}. ${esc(p.label)}</span><strong>${esc(dqChartNum(p.value))}</strong><span class="small">占首阶段 ${(p.value/points[0].value*100).toFixed(1)}%</span></div><div class="dq-funnel-track"><div class="dq-funnel-bar" style="width:${p.value/points[0].value*100}%" title="${esc(p.label+'：'+p.value)}"></div></div></div>`).join('')}</div>`;

function dqBindCharts(t,r){const el=$('#dq-results');if(!r||r.status!=='success'||!r.rows.length||r.explain)return;const update=(change,focus)=>{Object.assign(t.chart,change);dqPersist();dqRenderResults();$('#dq-results').querySelector(focus)?.focus({preventScroll:true})};el.querySelectorAll('[data-chart-type]').forEach(b=>b.onclick=()=>update({type:b.dataset.chartType},'[data-chart-type="'+b.dataset.chartType+'"]'));for(const key of ['dimension','metric']){const input=$('#dq-chart-'+key);if(input)input.onchange=()=>update({[key]:Number(input.value)},'#dq-chart-'+key)}const data=dqChartPoints(r,t.chart);if(data.points)el.querySelectorAll('[data-chart-point]').forEach(node=>{const p=data.points[Number(node.dataset.chartPoint)],read=()=>{const out=$('#dq-chart-readout');if(out)out.textContent=p.label+'：'+p.value+(t.chart.type==='pie'?'（'+(p.value/data.total*100).toFixed(1)+'%）':'')};node.onpointerenter=read;node.onfocus=read})}

function dqExportResult(t,r){
 if(!ensureSession())return;
 if(t.running||r.status!=='success'||!r.rows.length){toast('暂无可导出的查询结果');return}
 let url,link;
 try{
  const dataset={headers:r.columns.map(c=>r.columnLabels?.[c]||c),rows:r.rows.map(row=>row.map(v=>v!==null&&typeof v==='object'?JSON.stringify(v):v))};
  const blob=new Blob([csvContent(dataset)],{type:'text/csv;charset=utf-8;'});
  const name=dqTitle(t).replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').slice(0,60)||'查询结果';
  url=URL.createObjectURL(blob);link=document.createElement('a');link.href=url;
  link.download=name+'_演示数据_'+r.time.slice(0,10)+'_'+r.rows.length+'行.csv';
  link.hidden=true;document.body.append(link);link.click();toast('已发起 '+r.rows.length+' 行演示数据的 CSV 下载');
 }catch{toast('导出未完成，请重试或检查浏览器的下载设置')}
 finally{if(link)link.remove();if(url)setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function dqRenderResults(){const el=$('#dq-results'),t=dqActive();if(!el||!t)return;const r=t.result;if(t.running){el.innerHTML='<div class="dq-empty"><h2>正在生成演示结果…</h2><p>可以切换到其他标签页，执行结果会保留在当前查询中。</p></div>';return}if(!r){el.innerHTML='<div class="dq-result-head"><h2>查询结果</h2><span class="small">尚未执行</span></div><div class="dq-empty"><h2>结果将在这里显示</h2><p>点击运行演示，查看预设假数据；也可按 Cmd / Ctrl + Enter。</p></div>';return}el.innerHTML=`<div class="dq-result-head"><h2>${r.explain?'演示执行计划':'查询结果'} · <span class="${r.status==='success'?'dq-status-success':'dq-status-error'}">${r.status==='success'?'成功':'失败'}</span></h2><span class="small">${r.signature!==dqSignature(t)?'内容已变更 · 以下为上次结果':'预设演示数据'}</span>${r.status==='success'?`<button type="button" id="dq-export" class="dq-export" data-od-id="query-export-csv" title="导出当前展示的全部结果（CSV）" ${r.rows.length?'':'disabled'}>导出 CSV</button>`:''}<div class="dq-result-meta"><span>演示耗时 ${r.duration} ms</span><span>${r.rows.length} 行${r.truncated?' · 已截断至 500 行':''}</span><span>${esc(new Date(r.time).toLocaleString('zh-CN',{hour12:false}))}</span><span style="overflow-wrap:anywhere">RequestId：${esc(r.requestId)}</span></div></div>${r.simulated?'<div class="dq-demo-note" data-od-id="demo-result-note"><strong>示例数据</strong><span>以下均为预设假数据。修改 SQL 或筛选条件不会执行真实查询；构建器仅演示结果列的变化。</span></div>':''}${r.status==='error'?`<div class="dq-error" role="alert">${esc(r.error)}</div>`:!r.rows.length?'<div class="dq-empty"><h2>查询成功，暂无匹配数据</h2><p>尝试调整日期范围或参数后再次运行。</p></div>':(r.explain?dqResultTable(r):dqChartTools(t,r)+dqChartView(t,r))}`;dqBindCharts(t,r);$('#dq-export')?.addEventListener('click',()=>dqExportResult(t,r));markControls(el,'query-results')}
const dqDemoMetadata=[{"name": "演示连接", "schemas": [{"name": "未指定数据库（演示）", "tables": [{"name": "event_log", "comment": "埋点事件日志表", "fields": [{"name": "id", "type": "BIGINT UNSIGNED", "comment": "主键", "nullable": false, "extra": "NOT NULL AUTO_INCREMENT"}, {"name": "package_name", "type": "VARCHAR(128)", "comment": "应用包名", "nullable": false, "extra": "NOT NULL"}, {"name": "app_version", "type": "VARCHAR(32)", "comment": "应用版本号", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "device_type", "type": "VARCHAR(16)", "comment": "设备类型", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "os_version", "type": "VARCHAR(32)", "comment": "系统版本", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "network_type", "type": "VARCHAR(8)", "comment": "网络类型", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "session_id", "type": "VARCHAR(64)", "comment": "会话ID", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "user_id", "type": "VARCHAR(64)", "comment": "用户ID", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "anonymous_id", "type": "VARCHAR(64)", "comment": "匿名身份ID", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "device_id", "type": "VARCHAR(64)", "comment": "设备ID（脱敏）", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "oaid", "type": "VARCHAR(64)", "comment": "OAID（脱敏）", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "install_id", "type": "VARCHAR(64)", "comment": "安装ID", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "login_status", "type": "TINYINT", "comment": "登录状态：0游客/1已登录", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "member_status", "type": "TINYINT", "comment": "会员状态：0否/1是", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "ip", "type": "VARCHAR(64)", "comment": "IP（脱敏）", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "click_id", "type": "VARCHAR(64)", "comment": "广告点击ID", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "event_id", "type": "VARCHAR(64)", "comment": "事件ID", "nullable": false, "extra": "NOT NULL"}, {"name": "event_name", "type": "VARCHAR(64)", "comment": "事件名称", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "event_time", "type": "DATETIME", "comment": "事件发生时间(UTC)", "nullable": false, "extra": "NOT NULL"}, {"name": "server_time", "type": "DATETIME", "comment": "服务端接收时间(UTC)", "nullable": false, "extra": "NOT NULL DEFAULT CURRENT_TIMESTAMP"}, {"name": "params", "type": "JSON", "comment": "事件私有参数（JSON）", "nullable": true, "extra": "DEFAULT NULL"}, {"name": "client_event_id", "type": "VARCHAR(128)", "comment": "客户端事件唯一ID（去重用，可选）", "nullable": true, "extra": "DEFAULT NULL"}], "indexes": [{"name": "PRIMARY", "columns": ["id"], "unique": true}, {"name": "idx_event_time", "columns": ["event_time"], "unique": false}, {"name": "idx_user", "columns": ["user_id", "event_time"], "unique": false}, {"name": "idx_anonymous", "columns": ["anonymous_id", "event_time"], "unique": false}, {"name": "idx_install", "columns": ["install_id", "event_time"], "unique": false}, {"name": "idx_event", "columns": ["event_id", "event_time"], "unique": false}, {"name": "idx_app", "columns": ["package_name", "event_time"], "unique": false}, {"name": "uk_client_event", "columns": ["client_event_id"], "unique": true}]}]}]}];
function dqMetadataTree(data,search){let hit=0;const q=search.toLowerCase();const html=data.map(db=>{const schemas=db.schemas.map(schema=>{const tables=schema.tables.filter(table=>[db.name,schema.name,table.name,table.comment,...table.fields.flatMap(f=>[f.name,f.type,f.comment])].join(' ').toLowerCase().includes(q)).map(table=>{hit++;return `<details open><summary><code>${esc(table.name)}</code><span class="small" style="display:block">${esc(table.comment)}</span></summary>${table.fields.map(f=>`<button data-dq-field="${esc(f.name)}" title="插入字段 ${esc(f.name)}"><strong>${esc(f.name)} <span>${esc(f.type)}</span></strong><span>${esc(f.comment||'无注释')}</span><span style="display:block">${f.nullable===false?'非空':'可空'}${f.extra?.includes('AUTO_INCREMENT')?' · 自增':''}${f.extra?.includes('CURRENT_TIMESTAMP')?' · 默认当前时间':''}</span></button>`).join('')}${table.indexes?`<details><summary>索引 · ${table.indexes.length}</summary>${table.indexes.map(ix=>`<p class="small mono" style="padding:8px 0;overflow-wrap:anywhere">${esc(ix.name)}${ix.unique?' · 唯一':''}<br>${esc(ix.columns.join(', '))}</p>`).join('')}</details>`:''}</details>`}).join('');return tables?`<details open><summary>${esc(schema.name)} <span class="small">Schema</span></summary>${tables}</details>`:''}).join('');return schemas?`<details open><summary>${esc(db.name)}</summary>${schemas}</details>`:''}).join('');return hit?html:'<p class="small">没有匹配的表或字段。</p>'}
async function dqRenderLibrary(){const el=$('#dq-library-body');if(!el)return;const env='demo',owner=dqOwner;
 if(dqLibrary==='metadata'){el.innerHTML='<p class="small">正在加载元数据…</p>';let data;try{data=dqDemoMetadata;if(!el.isConnected||dqLibrary!=='metadata'||owner!==dqOwner)return;el.innerHTML=`<input id="dq-meta-search" aria-label="搜索元数据" placeholder="搜索表名、字段或注释" value="${esc(dqSearch)}"><div class="dq-tree" id="dq-tree">${dqMetadataTree(data,dqSearch)}</div><p class="dq-library-note">数据库 → Schema → 表 → 字段<br>${dqActive()?.mode==='builder'?'点击字段名添加筛选条件。':'点击字段名插入当前 SQL。'}${env==='demo'?'<br>表与字段依据提供的 MySQL DDL。数据库名未提供，连接与记录为演示。':''}</p>`;const bind=()=>el.querySelectorAll('[data-dq-field]').forEach(b=>b.onclick=()=>{const t=dqActive();if(!t){toast('请先新建一个查询标签页。');return}if(t.mode==='builder'){qbEdit('filters',-1,b.dataset.dqField);return}const word='`'+b.dataset.dqField.replaceAll('`','``')+'`';if(dqEditor){dqEditor.executeEdits('metadata',[{range:dqEditor.getSelection(),text:word}]);dqEditor.focus()}else{const input=$('#dq-fallback');input.setRangeText(word,input.selectionStart,input.selectionEnd,'end');dqChanged(t,input.value);input.focus()}});bind();$('#dq-meta-search').oninput=e=>{dqSearch=e.target.value;$('#dq-tree').innerHTML=dqMetadataTree(data,dqSearch);bind()}}catch(e){if(el.isConnected)el.innerHTML=`<p class="small">${esc(e.message)}</p>`}}
 if(dqLibrary==='templates'){el.innerHTML='<p class="small">正在加载模板…</p>';try{let templates=dqState.templates;if(!el.isConnected||dqLibrary!=='templates'||owner!==dqOwner)return;el.innerHTML=`<p class="small">当前浏览器保存<br>打开模板将新建标签页。</p>${templates.length?templates.map(x=>`<article class="dq-library-card" data-od-id="saved-template-${esc(x.id)}"><button data-dq-template="${esc(x.id)}"><strong>${esc(x.name)}</strong><span class="small" style="display:block">${x.params.length} 个参数 · ${esc(x.sql.split('\n')[0].slice(0,60))}</span></button><button class="dq-card-action" data-dq-delete-template="${esc(x.id)}">删除模板</button></article>`).join(''):'<div class="dq-empty" style="padding:24px 0"><h2>还没有模板</h2><p>编写 SQL、配置参数后，点击“保存脚本”。</p></div>'}`;el.querySelectorAll('[data-dq-template]').forEach(b=>b.onclick=()=>{const x=templates.find(x=>String(x.id)===b.dataset.dqTemplate);dqAdd(x.sql,x.params,Object.fromEntries(x.params.map(p=>[p.name,p.defaultValue])),x.env||env,x.builder||null)});el.querySelectorAll('[data-dq-delete-template]').forEach(b=>b.onclick=()=>dqConfirm('删除模板','删除后无法恢复，已打开的查询标签页不受影响。',async()=>{try{dqState.templates=dqState.templates.filter(x=>String(x.id)!==b.dataset.dqDeleteTemplate);dqPersist();dqRenderLibrary()}catch(e){toast('删除失败：'+e.message)}}))}catch(e){if(el.isConnected)el.innerHTML=`<p class="small">${esc(e.message)}</p>`}}
 if(dqLibrary==='history'){el.innerHTML=`<form id="dq-history-filter" class="dq-history-filters"><label for="dq-history-start">开始日期（本地时间）</label><input type="date" id="dq-history-start" value="${dqHistoryFilter.start}"><label for="dq-history-end">结束日期（含当天）</label><input type="date" id="dq-history-end" value="${dqHistoryFilter.end}"><p class="error" id="dq-history-error" role="alert"></p><button type="submit">筛选历史</button><button type="button" id="dq-history-reset" class="text-btn">重置筛选</button></form><p class="small">仅当前账号与浏览器 · 最近 100 次<br>点击记录，在新标签页恢复执行 SQL 与参数。</p><div id="dq-history-list"></div>`;const draw=()=>{const list=dqState.history.filter(x=>{const d=new Date(x.result.time),day=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return (!dqHistoryFilter.env||dqHistoryFilter.env===x.env)&&(!dqHistoryFilter.start||day>=dqHistoryFilter.start)&&(!dqHistoryFilter.end||day<=dqHistoryFilter.end)});$('#dq-history-list').innerHTML=list.length?list.map(x=>`<article class="dq-library-card" data-od-id="query-history-${x.id}"><button data-dq-history="${x.id}"><strong>${esc(x.sql.split('\n').find(s=>s.trim())?.slice(0,70))}</strong><span class="small" style="display:block">${esc(new Date(x.result.time).toLocaleString('zh-CN',{hour12:false}))}</span><span class="small">演示记录 · <span class="${x.result.status==='success'?'dq-status-success':'dq-status-error'}">${x.result.status==='success'?'成功':'失败'}</span><br>${x.result.duration} ms · ${x.result.rows.length} 行${x.result.truncated?'（截断）':''}<br>RequestId：${esc(x.result.requestId)}</span></button><button class="dq-card-action" data-dq-delete-history="${x.id}">删除记录</button></article>`).join(''):'<p class="small" style="margin-top:24px">暂无符合条件的查询历史。</p>';el.querySelectorAll('[data-dq-history]').forEach(b=>b.onclick=()=>{const h=dqState.history.find(x=>x.id===b.dataset.dqHistory);dqAdd(h.sql,h.params,h.values,h.env,h.builder||null)});el.querySelectorAll('[data-dq-delete-history]').forEach(b=>b.onclick=()=>dqConfirm('删除查询历史','仅删除这条历史记录，不影响已打开的标签页或模板。',()=>{dqState.history=dqState.history.filter(x=>x.id!==b.dataset.dqDeleteHistory);dqPersist();dqRenderLibrary()}));markControls(el,'query-history')};draw();$('#dq-history-filter').onsubmit=e=>{e.preventDefault();const start=$('#dq-history-start').value,end=$('#dq-history-end').value;if(start&&end&&start>end){$('#dq-history-error').textContent='开始日期不能晚于结束日期。';return}$('#dq-history-error').textContent='';dqHistoryFilter={env:'',start,end};draw()};$('#dq-history-reset').onclick=()=>{dqHistoryFilter={env:'',start:'',end:''};dqRenderLibrary()}}
 markControls(el,'query-library');
}
function dqSaveTemplate(){const t=dqActive();if(!t.sql.trim()){toast('请先输入 SQL 再保存。');return}showDrawer('保存脚本为模板',`${t.mode==='builder'?'保存构建步骤与当前筛选条件，下次可直接修改复用。':'保存 SQL 和参数定义；下次使用默认值，不保存本次填写值。'}`,`<form id="dq-save-form" class="form-stack"><label class="field">模板名称<input id="dq-template-name" value="${esc(dqTitle(t))}" maxlength="64" required></label><p class="small">${t.params.length} 个参数<br>保存至当前账号的浏览器本地存储。</p><p id="dq-save-error" class="error" role="alert"></p></form>`,`<button data-close>取消</button><button class="primary" id="dq-template-save">保存模板</button>`);$('#dq-template-save').onclick=async()=>{if(!$('#dq-save-form').reportValidity())return;const name=$('#dq-template-name').value.trim();if(!name){$('#dq-save-error').textContent='模板名称不能为空。';return}const item={id:dqId(),name,sql:t.sql,mode:t.mode||'sql',builder:t.mode==='builder'?dqClone(t.builder):null,params:dqClone(t.params),env:t.env,updatedAt:new Date().toISOString()};const button=$('#dq-template-save');button.disabled=true;try{if(dqState.templates.some(x=>x.env===t.env&&x.name===name))throw Error('同名模板已存在，请使用不同名称。');const next=[item,...dqState.templates];localStorage.setItem('admin-query-workspace-v1:'+dqOwner,JSON.stringify({...dqState,templates:next}));dqState.templates=next;closeDrawer();dqLibrary='templates';document.querySelectorAll('[data-dq-library]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dqLibrary===dqLibrary));dqRenderLibrary();toast('模板已保存')}catch(e){$('#dq-save-error').textContent='保存失败：'+e.message;button.disabled=false}}}
document.addEventListener('keydown',e=>{if(page==='data_query'&&(e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!dqEditor){e.preventDefault();dqRun(false)}});
window.addEventListener('beforeunload',dqPersist);

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
const params=new URLSearchParams(location.search);if(['users','admin_users','data_query',...Object.keys(moneyConfig)].includes(params.get('page')))page=params.get('page');
function applyInitialState(){
 if(initialStateApplied||!ensureSession())return;initialStateApplied=true;
 const state=params.get('state');if(page==='data_query')return;if(page==='admin_users'){if(state==='create')openAdminForm();return}
 if(state==='create')openAppForm();if(state==='edit'&&apps.length)openAppForm(apps[0].id);if(state==='app-detail'&&apps.length)openAppDetail(apps[0].id);if(state==='delete'&&apps.length)openAppDelete(apps[0].id);if(state==='user-detail'){page='users';render();openUser(params.get('record')||users[0].Id)}if(state==='no-results'){if(page==='apps')appQuery='DEMO-NO-MATCH';else if(isMoneyPage())moneyFilters[page]={q:'DEMO-NO-MATCH',by:'user_id'};else userFilters={q:'DEMO-NO-MATCH',by:'user_id'};render()}
 if(state==='detail'&&isMoneyPage())openMoneyDetail(params.get('record')||monetizationData[page][0].id);
}
render();if(authSession){armSessionTimer();applyInitialState()}
</script>
